name: Auvik read-only connector tests
on:
  pull_request:
    paths:
      - "tx-verifier/tools/auvik_readonly.py"
      - "tx-verifier/tests/test_auvik_readonly.py"
      - "tx-verifier/AUVIK_READONLY.md"
      - ".github/workflows/auvik-readonly-tests.yml"
  push:
    branches:
      - "feat/auvik-readonly-integration"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Auvik read-only tests
        working-directory: tx-verifier
        run: python -m unittest tests.test_auvik_readonly -v
