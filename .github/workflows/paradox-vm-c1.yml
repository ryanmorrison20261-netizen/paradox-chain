name: Paradox VM C1

on:
  push:
    branches: [main, feat/der-multiauth-cdp-adapter]
    paths:
      - "paradox-vm/c1/**"
      - ".github/workflows/paradox-vm-c1.yml"
  pull_request:
    paths:
      - "paradox-vm/c1/**"
      - ".github/workflows/paradox-vm-c1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c1-movement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run C1 test suite
        working-directory: paradox-vm/c1
        run: python -m unittest -v
      - name: Run reproducible movement scenario
        working-directory: paradox-vm/c1
        run: |
          python movement.py > c1-result.json
          cat c1-result.json
          python -c "import json; d=json.load(open('c1-result.json')); assert d['passed'] and d['position_m'] == '45'"
